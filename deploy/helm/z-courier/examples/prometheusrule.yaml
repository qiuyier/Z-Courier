apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: z-courier-alerts
  namespace: z-courier
  labels:
    app.kubernetes.io/name: z-courier
    app.kubernetes.io/component: alerts
spec:
  groups:
    - name: z-courier.alerts
      rules:
        - alert: ZCourierGatewayTargetDown
          expr: up{job=~"z-courier.*"} == 0
          for: 1m
          labels:
            severity: critical
            component: gateway
          annotations:
            summary: "Z-Courier gateway metrics target is down"
            description: "Prometheus cannot scrape {{ $labels.instance }} for job {{ $labels.job }}."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#gateway-unreachable"

        - alert: ZCourierGatewayDrainingTooLong
          expr: sum by (job, instance) (z_courier_gateway_readiness{status="draining"}) > 0
          for: 10m
          labels:
            severity: warning
            component: gateway
          annotations:
            summary: "Z-Courier gateway has been draining for too long"
            description: "Gateway {{ $labels.instance }} has remained in readiness drain for more than 10 minutes. Check online sessions, cluster route cleanup, and shutdown logs."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#graceful-shutdown"

        - alert: ZCourierAuthFailureRatioHigh
          expr: (sum(rate(z_courier_auth_verify_total{result!="success"}[5m])) / clamp_min(sum(rate(z_courier_auth_verify_total[5m])), 1e-9)) > 0.05 and sum(rate(z_courier_auth_verify_total[5m])) > 1
          for: 5m
          labels:
            severity: warning
            component: auth
          annotations:
            summary: "Z-Courier auth failure ratio is high"
            description: "More than 5% of auth verification attempts failed while auth traffic is above 1/sec."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#client-cannot-connect-or-bind"

        - alert: ZCourierHMACSignatureFailures
          expr: sum(rate(z_courier_internal_http_signature_total{result!="success"}[5m])) + sum(rate(z_courier_cluster_peer_signature_total{result!="success"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            component: internal-http
          annotations:
            summary: "Z-Courier HMAC signature failures detected"
            description: "Internal HTTP or cluster peer HMAC verification is failing. Check key IDs, clock skew, nonce replay, and rollout overlap."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#internal-hmac-failures"

        - alert: ZCourierUpstreamFailureRatioHigh
          expr: (sum(rate(z_courier_upstream_forward_total{result!="success"}[5m])) / clamp_min(sum(rate(z_courier_upstream_forward_total[5m])), 1e-9)) > 0.05 and sum(rate(z_courier_upstream_forward_total[5m])) > 1
          for: 5m
          labels:
            severity: warning
            component: upstream
          annotations:
            summary: "Z-Courier upstream forwarding failure ratio is high"
            description: "More than 5% of upstream forwards failed while upstream traffic is above 1/sec."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#upstream-forwarding-failures"

        - alert: ZCourierUpstreamRouteDegraded
          expr: sum by (job, instance, route, target_type) (z_courier_upstream_route_degraded) > 0
          for: 2m
          labels:
            severity: warning
            component: upstream
          annotations:
            summary: "Z-Courier upstream route is degraded"
            description: "At least one HTTP upstream route has repeated forwarding failures. Check cmd/admin diagnostics for route state and last_reason."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#upstream-forwarding-failures"

        - alert: ZCourierUpstreamDiscoveryEmpty
          expr: |
            (
              max by (job, instance, route, discovery_type) (z_courier_upstream_discovery_resolved_endpoints) == 0
            )
            and on (job, instance)
            (
              max by (job, instance) (z_courier_gateway_readiness{status="ready"}) == 1
            )
          for: 5m
          labels:
            severity: warning
            component: upstream-discovery
          annotations:
            summary: "Z-Courier upstream discovery has no resolved endpoints"
            description: "Ready gateway {{ $labels.instance }} has no resolved endpoints for route {{ $labels.route }} ({{ $labels.discovery_type }})."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#upstream-discovery-unavailable"

        - alert: ZCourierUpstreamDiscoveryAllEndpointsUnavailable
          expr: |
            (
              max by (job, instance, route, discovery_type) (z_courier_upstream_endpoint_unhealthy)
              >=
              max by (job, instance, route, discovery_type) (z_courier_upstream_discovery_resolved_endpoints)
            )
            and
            (
              max by (job, instance, route, discovery_type) (z_courier_upstream_discovery_resolved_endpoints) > 0
            )
            and on (job, instance, route, discovery_type)
            (
              sum by (job, instance, route, discovery_type) (rate(z_courier_upstream_endpoint_selection_total{result="no_available"}[5m])) > 0
            )
            and on (job, instance)
            (
              max by (job, instance) (z_courier_gateway_readiness{status="ready"}) == 1
            )
          for: 5m
          labels:
            severity: warning
            component: upstream-discovery
          annotations:
            summary: "Z-Courier upstream discovery cannot select an endpoint"
            description: "Ready gateway {{ $labels.instance }} cannot select an endpoint for route {{ $labels.route }} because every resolved endpoint remains unavailable."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#upstream-discovery-unavailable"

        - alert: ZCourierOverloadRejects
          expr: sum(rate(z_courier_upstream_overload_rejected_total[5m])) + sum(rate(z_courier_internal_http_overload_rejected_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
            component: capacity
          annotations:
            summary: "Z-Courier capacity limiter is rejecting work"
            description: "Internal HTTP or upstream capacity limits are rejecting requests. Check backend push rate and max_in_flight settings."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#capacity-or-overload-rejections"

        - alert: ZCourierTrafficPolicyStoreUnavailable
          expr: sum by (job, instance, mode) (rate(z_courier_traffic_policy_quota_store_total{mode="redis",result="admission_unavailable"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
            component: traffic-policy
          annotations:
            summary: "Z-Courier traffic policy store is unavailable"
            description: "Gateway {{ $labels.instance }} cannot make Redis traffic policy decisions and is failing closed."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#traffic-policy-admission"

        - alert: ZCourierTrafficPolicyLocalKeyCapacityHigh
          expr: max by (job, instance) (z_courier_traffic_policy_local_keys{mode="local"}) / clamp_min(max by (job, instance) (z_courier_traffic_policy_local_key_limit{mode="local"}), 1) >= 0.8
          for: 10m
          labels:
            severity: warning
            component: traffic-policy
          annotations:
            summary: "Z-Courier local traffic policy key capacity is high"
            description: "Gateway {{ $labels.instance }} local traffic policy key usage has remained at or above 80% of its configured limit."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#traffic-policy-admission"

        - alert: ZCourierTrafficPolicyOverloaded
          expr: sum by (job, instance, mode) (rate(z_courier_traffic_policy_quota_store_total{result="overloaded"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            component: traffic-policy
          annotations:
            summary: "Z-Courier traffic policy admission is overloaded"
            description: "Gateway {{ $labels.instance }} is returning overloaded decisions from the {{ $labels.mode }} traffic policy store."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#traffic-policy-admission"

        - alert: ZCourierTrafficPolicyRateLimitedRatioHigh
          expr: |
            (
              sum by (job, instance, mode, policy, key_scope) (rate(z_courier_traffic_policy_quota_store_total{result="rate_limited"}[5m]))
              /
              clamp_min(sum by (job, instance, mode, policy, key_scope) (rate(z_courier_traffic_policy_quota_store_total[5m])), 1e-9)
            ) > 0.2
            and
            sum by (job, instance, mode, policy, key_scope) (rate(z_courier_traffic_policy_quota_store_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
            component: traffic-policy
          annotations:
            summary: "Z-Courier traffic policy rate-limited ratio is high"
            description: "Policy {{ $labels.policy }} on gateway {{ $labels.instance }} has rejected more than 20% of decisions while decision traffic exceeds 1/sec."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#traffic-policy-admission"

        - alert: ZCourierDownlinkPushFailures
          expr: sum(rate(z_courier_downlink_push_total{result!~"sent|queued"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            component: downlink
          annotations:
            summary: "Z-Courier downlink push failures detected"
            description: "Downlink push results other than sent or queued are above 0.1/sec."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#client-not-receiving-downlink"

        - alert: ZCourierRetryWorkerFailures
          expr: sum(rate(z_courier_downlink_retry_scan_total{result!="success"}[5m])) + sum(rate(z_courier_downlink_retry_claim_messages_total{result!="success"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            component: downlink-retry
          annotations:
            summary: "Z-Courier downlink retry worker failures detected"
            description: "Retry scan or claim operations are failing. Check PostgreSQL, leases, and gateway logs."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#retry-backlog-growing"

        - alert: ZCourierAdminAuditWriteFailures
          expr: sum(rate(z_courier_admin_audit_write_total{result!="success"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            component: admin-audit
          annotations:
            summary: "Z-Courier admin audit writes are failing"
            description: "Admin audit store writes have failed for at least 5 minutes. Check admin audit storage configuration, PostgreSQL health, and gateway logs."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#postgresql-store-errors"

        - alert: ZCourierAdminSessionStoreFailures
          expr: sum(rate(z_courier_admin_session_store_operation_total{result=~"error|not_configured"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            component: admin-session
          annotations:
            summary: "Z-Courier admin session store operations are failing"
            description: "Admin session store operations are failing. Check Redis-backed admin session settings, Redis reachability, and gateway logs."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#redis-route-issues"

        - alert: ZCourierClusterPeerPushFailureRatioHigh
          expr: (sum(rate(z_courier_cluster_peer_push_total{result!="success"}[5m])) / clamp_min(sum(rate(z_courier_cluster_peer_push_total[5m])), 1e-9)) > 0.05 and sum(rate(z_courier_cluster_peer_push_total[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            component: cluster
          annotations:
            summary: "Z-Courier cluster peer push failure ratio is high"
            description: "More than 5% of peer pushes failed. Check peer internal HTTP, HMAC config, and network policy."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#peer-push-failing"

        - alert: ZCourierClusterStaleRoutesDetected
          expr: sum(rate(z_courier_cluster_stale_routes_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
            component: cluster
          annotations:
            summary: "Z-Courier stale cluster routes detected"
            description: "Gateway is observing stale online routes. Check Redis TTL, route refresh, and disconnect cleanup."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#redis-route-stale-or-wrong-node"

        - alert: ZCourierJWKSRefreshFailures
          expr: sum(rate(z_courier_auth_jwks_refresh_total{result!="success"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            component: auth
          annotations:
            summary: "Z-Courier JWKS refresh failures detected"
            description: "JWT/JWKS refresh is failing. Check JWKS endpoint reachability, status code, response size, and key format."
            runbook_url: "https://github.com/qiuyier/Z-Courier/blob/main/docs/v5-production-runbook.md#client-cannot-connect-or-bind"
