# Example production values. Replace image, secret, and dependency addresses
# before installing. Do not put real secret values in this file.

replicaCount: 2

image:
  repository: ghcr.io/qiuyier/z-courier-gateway
  tag: v0.17.0
  pullPolicy: IfNotPresent

secret:
  create: false
  name: z-courier-secret

clientService:
  type: LoadBalancer
  port: 8999

internalService:
  type: ClusterIP
  port: 18080

adminConsole:
  enabled: false
  path: /console/
  session:
    store:
      type: redis
      redis:
        addr: redis-master.z-courier.svc.cluster.local:6379
        keyPrefix: zcourier:production-k8s:admin-session
  monitoring:
    prometheusURL: https://prometheus.example.internal
    grafanaURL: https://grafana.example.internal
    dashboardURL: https://grafana.example.internal/d/z-courier-overview/z-courier-overview
  audit:
    type: postgres
    postgres:
      dsn: "postgres://zcourier:${ZCOURIER_POSTGRES_PASSWORD}@postgresql.z-courier.svc.cluster.local:5432/zcourier?sslmode=disable"

auth:
  http:
    url: http://auth-backend.z-courier.svc.cluster.local:8080/gateway/auth/verify

cluster:
  enabled: true
  registry:
    redis:
      addr: redis-master.z-courier.svc.cluster.local:6379
      keyPrefix: zcourier:production-k8s

downlink:
  storage:
    postgres:
      dsn: "postgres://zcourier:${ZCOURIER_POSTGRES_PASSWORD}@postgresql.z-courier.svc.cluster.local:5432/zcourier?sslmode=disable"
      autoMigrate: true
  delivery:
    retryJitter: 5s
  policies:
    # Disabled example. Enable only after assigning a reviewed MsgID range.
    - name: production-critical
      enabled: false
      msgIDMin: 3000
      msgIDMax: 3099
      maxAttempts: 20
      maxAge: 24h
      ackTimeout: 30s
      retryDelay: 5s
      backoffMultiplier: 2
      maxRetryDelay: 5m
      retryJitter: 5s
  capacity:
    # Benchmark before enabling the globally serialized admission limit.
    maxPendingGlobal: 0
    maxPendingPerDevice: 1000
  terminal:
    publisher:
      type: none
      # To publish terminal events, change type to nsq and add:
      # nsq:
      #   nsqdAddrs: [nsqd.z-courier.svc.cluster.local:4150]
      #   topic: downlink_terminal_events
      #   authSecret: ""
      #   dialTimeout: 1s
      #   readTimeout: 60s
      #   writeTimeout: 1s
      #   publishMode: round_robin
      #   retryAttempts: 2
      # Or change type to http and add the terminal webhook HMAC key to the
      # referenced Kubernetes Secret:
      # http:
      #   url: https://terminal-events.example.internal/v1/z-courier
      #   timeout: 5s
      #   allowInsecureHTTP: false
      #   hmac:
      #     keyID: gateway-terminal-v1
      #     secretEnv: ZCOURIER_TERMINAL_WEBHOOK_HMAC_SECRET
      #   tls:
      #     serverName: terminal-events.example.internal
      #     secret:
      #       name: z-courier-terminal-webhook-tls
      #       mountPath: /run/secrets/terminal-webhook
      #       caKey: ca.crt
      #       clientCertKey: tls.crt
      #       clientKeyKey: tls.key
    retryInterval: 5s
    retryDelay: 30s
    retryJitter: 5s
    backoffMultiplier: 2
    maxRetryDelay: 5m
    retryLease: 30s
    scanLimit: 100

pipeline:
  rateLimit:
    enabled: false
  trafficPolicies:
    enabled: true
    mode: redis
    maxKeys: 100000
    idleTTL: 10m
    defaultPolicy: ""
    redis:
      addr: redis-master.z-courier.svc.cluster.local:6379
      username: ""
      passwordEnv: ZCOURIER_REDIS_PASSWORD
      db: 0
      keyPrefix: zcourier:production-k8s:traffic-policy
      dialTimeout: 1s
      readTimeout: 500ms
      writeTimeout: 500ms
      operationTimeout: 250ms
      failureMode: fail_closed
    policies:
      - name: production-shared-client
        enabled: true
        priority: 100
        match: {}
        key: client_id
        tokenBucket:
          capacity: 1000
          refillTokens: 1000
          refillInterval: 1s

upstream:
  routesFile:
    enabled: true
    maxSizeBytes: 1048576
    reload:
      enabled: true
      drainTimeout: 30s
      acceptedMsgIDRanges:
        - min: 1001
          max: 1999
        - min: 2000
          max: 2999
  routes:
    - name: production-http-upstream
      enabled: true
      msgIDMin: 1001
      msgIDMax: 1999
      target:
        type: http
        path: /gateway/upstream
        discovery:
          type: dns
          scheme: http
          hostname: business-backend-headless.z-courier.svc.cluster.local
          port: 8080
          refreshInterval: 10s
        tokenEnv: ZCOURIER_UPSTREAM_INTERNAL_TOKEN
        timeout: 5s
        maxInFlight: 2000
        failover:
          enabled: true
          maxAttempts: 2
          unhealthyCooldown: 15s
    - name: production-nsq-upstream
      enabled: true
      msgIDMin: 2000
      msgIDMax: 2999
      target:
        type: nsq
        nsqdAddrs:
          - nsqd.z-courier.svc.cluster.local:4150
        topic: message_events
        authSecret: ""
        dialTimeout: 1s
        readTimeout: 60s
        writeTimeout: 1s
        publishMode: round_robin
        retryAttempts: 2
        maxInFlight: 2000

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
