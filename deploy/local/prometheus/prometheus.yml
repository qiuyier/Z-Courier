global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: z-courier
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:18182
          - host.docker.internal:18183

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
