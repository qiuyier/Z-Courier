services:
  gateway-a:
    image: z-courier-gateway:production-cluster
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: z-courier-production-gateway-a
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nsqd:
        condition: service_started
    ports:
      - "${ZCOURIER_PRODUCTION_GATEWAY_A_PORT:-8999}:8999"
    expose:
      - "18080"
    environment:
      ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN: ${ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN:?set ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN}
      ZCOURIER_ADMIN_CONSOLE_ENABLED: ${ZCOURIER_ADMIN_CONSOLE_ENABLED:-false}
      ZCOURIER_ADMIN_SESSION_ENABLED: ${ZCOURIER_ADMIN_SESSION_ENABLED:-false}
      ZCOURIER_INTERNAL_HMAC_SECRET: ${ZCOURIER_INTERNAL_HMAC_SECRET:?set ZCOURIER_INTERNAL_HMAC_SECRET}
      ZCOURIER_PEER_HMAC_SECRET: ${ZCOURIER_PEER_HMAC_SECRET:?set ZCOURIER_PEER_HMAC_SECRET}
      ZCOURIER_POSTGRES_PASSWORD: ${ZCOURIER_POSTGRES_PASSWORD:?set ZCOURIER_POSTGRES_PASSWORD}
      ZCOURIER_REDIS_PASSWORD: ${ZCOURIER_REDIS_PASSWORD:?set ZCOURIER_REDIS_PASSWORD}
      ZCOURIER_TERMINAL_WEBHOOK_HMAC_SECRET: ${ZCOURIER_TERMINAL_WEBHOOK_HMAC_SECRET:-}
      ZCOURIER_UPSTREAM_INTERNAL_TOKEN: ${ZCOURIER_UPSTREAM_INTERNAL_TOKEN:?set ZCOURIER_UPSTREAM_INTERNAL_TOKEN}
    volumes:
      - ./config/gateway-a.yaml:/app/configs/z-courier.yaml:ro
      - ./conf/zinx.json:/app/conf/zinx.json:ro
      - ./routes:/app/routes:ro
    restart: unless-stopped
    networks:
      - zcourier-private

  gateway-b:
    image: z-courier-gateway:production-cluster
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: z-courier-production-gateway-b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nsqd:
        condition: service_started
    ports:
      - "${ZCOURIER_PRODUCTION_GATEWAY_B_PORT:-9000}:8999"
    expose:
      - "18080"
    environment:
      ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN: ${ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN:?set ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN}
      ZCOURIER_ADMIN_CONSOLE_ENABLED: ${ZCOURIER_ADMIN_CONSOLE_ENABLED:-false}
      ZCOURIER_ADMIN_SESSION_ENABLED: ${ZCOURIER_ADMIN_SESSION_ENABLED:-false}
      ZCOURIER_INTERNAL_HMAC_SECRET: ${ZCOURIER_INTERNAL_HMAC_SECRET:?set ZCOURIER_INTERNAL_HMAC_SECRET}
      ZCOURIER_PEER_HMAC_SECRET: ${ZCOURIER_PEER_HMAC_SECRET:?set ZCOURIER_PEER_HMAC_SECRET}
      ZCOURIER_POSTGRES_PASSWORD: ${ZCOURIER_POSTGRES_PASSWORD:?set ZCOURIER_POSTGRES_PASSWORD}
      ZCOURIER_REDIS_PASSWORD: ${ZCOURIER_REDIS_PASSWORD:?set ZCOURIER_REDIS_PASSWORD}
      ZCOURIER_TERMINAL_WEBHOOK_HMAC_SECRET: ${ZCOURIER_TERMINAL_WEBHOOK_HMAC_SECRET:-}
      ZCOURIER_UPSTREAM_INTERNAL_TOKEN: ${ZCOURIER_UPSTREAM_INTERNAL_TOKEN:?set ZCOURIER_UPSTREAM_INTERNAL_TOKEN}
    volumes:
      - ./config/gateway-b.yaml:/app/configs/z-courier.yaml:ro
      - ./conf/zinx.json:/app/conf/zinx.json:ro
      - ./routes:/app/routes:ro
    restart: unless-stopped
    networks:
      - zcourier-private

  postgres:
    image: postgres:16-alpine
    container_name: z-courier-production-cluster-postgres
    environment:
      POSTGRES_USER: zcourier
      POSTGRES_PASSWORD: ${ZCOURIER_POSTGRES_PASSWORD:?set ZCOURIER_POSTGRES_PASSWORD}
      POSTGRES_DB: zcourier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcourier -d zcourier"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - zcourier-private

  redis:
    image: redis:8-alpine
    container_name: z-courier-production-cluster-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${ZCOURIER_REDIS_PASSWORD:?set ZCOURIER_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${ZCOURIER_REDIS_PASSWORD:?set ZCOURIER_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - zcourier-private

  nsqlookupd:
    image: nsqio/nsq:latest
    container_name: z-courier-production-cluster-nsqlookupd
    command: /nsqlookupd
    restart: unless-stopped
    networks:
      - zcourier-private

  nsqd:
    image: nsqio/nsq:latest
    container_name: z-courier-production-cluster-nsqd
    command:
      - /nsqd
      - --lookupd-tcp-address=nsqlookupd:4160
      - --broadcast-address=nsqd
    depends_on:
      - nsqlookupd
    restart: unless-stopped
    networks:
      - zcourier-private

  prometheus:
    image: prom/prometheus:latest
    container_name: z-courier-production-cluster-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${ZCOURIER_PRODUCTION_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway-a
      - gateway-b
    restart: unless-stopped
    networks:
      - zcourier-private

networks:
  zcourier-private:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
