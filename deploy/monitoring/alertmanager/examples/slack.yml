global:
  resolve_timeout: 5m

route:
  receiver: z-courier-slack
  group_by:
    - alertname
    - component
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: z-courier-slack-critical
      matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: z-courier-slack
    slack_configs:
      - api_url: https://hooks.slack.com/services/replace/with/webhook
        channel: "#z-courier-alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  - name: z-courier-slack-critical
    slack_configs:
      - api_url: https://hooks.slack.com/services/replace/with/critical-webhook
        channel: "#z-courier-critical"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - job
      - instance
