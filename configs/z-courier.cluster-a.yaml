gateway_node: gateway-a
route_msg_ids:
  - 1000

auth:
  static_tokens:
    e2e-token:
      client_id: e2e-client
      token_id: e2e-token
      scopes:
        - gateway:dev

internal_http:
  enabled: true
  addr: 127.0.0.1:18182
  token: dev-internal-token
  auth:
    mode: token
  max_request_body_size: 10485760
  max_in_flight: 1000

admin_console:
  enabled: true
  path: /console/
  assets_dir: web/admin/dist
  monitoring:
    prometheus_url: http://127.0.0.1:19090
    grafana_url: http://127.0.0.1:13000
    dashboard_url: http://127.0.0.1:13000/d/z-courier-overview/z-courier-overview
  session:
    enabled: true
    ttl: 8h
    cookie_name: zcourier_admin_session_a
    cookie_secure: false
    cookie_same_site: lax
    role: admin
    store:
      type: redis
      redis:
        addr: 127.0.0.1:16379
        username: ""
        password: ""
        db: 0
        key_prefix: zcourier:e2e-cluster:admin-session
        dial_timeout: 1s
        read_timeout: 1s
        write_timeout: 1s
        operation_timeout: 2s
  audit:
    type: postgres
    capacity: 1000
    postgres:
      dsn: postgres://zcourier:zcourier@127.0.0.1:15432/zcourier?sslmode=disable
      auto_migrate: true
      max_open_conns: 10
      max_idle_conns: 5
      conn_max_lifetime: 30m
      operation_timeout: 2s

cluster:
  enabled: true
  internal_addr: http://127.0.0.1:18182
  route_refresh_interval: 1s
  registry:
    type: redis
    ttl: 3s
    redis:
      addr: 127.0.0.1:16379
      username: ""
      password: ""
      db: 0
      key_prefix: zcourier:e2e-cluster
      dial_timeout: 1s
      read_timeout: 1s
      write_timeout: 1s
  peer:
    timeout: 2s
    auth:
      mode: hmac
      hmac:
        key_id: e2e-cluster-2026-01
        keys:
          e2e-cluster-2026-01: dev-cluster-hmac-secret-0123456789abcdef
        max_clock_skew: 30s
        nonce_ttl: 1m
        max_nonce_entries: 10000

downlink:
  storage:
    type: postgres
    postgres:
      dsn: postgres://zcourier:zcourier@127.0.0.1:15432/zcourier?sslmode=disable
      auto_migrate: true
      max_open_conns: 10
      max_idle_conns: 5
      conn_max_lifetime: 30m
  delivery:
    retry_interval: 1s
    retry_delay: 1s
    ack_timeout: 1s
    retry_lease: 5s
    max_attempts: 5
    scan_limit: 100
    bind_flush_limit: 100
    retry_fairness:
      enabled: true
      candidate_multiplier: 4
  policies:
    - name: integration-reliable
      enabled: true
      msg_id_min: 2001
      msg_id_max: 2001
      max_attempts: 5
      max_age: 1h
      ack_timeout: 1s
      retry_delay: 1s
      backoff_multiplier: 2
      max_retry_delay: 4s
      retry_jitter: 0s
    - name: integration-terminal
      enabled: true
      msg_id_min: 2999
      msg_id_max: 2999
      max_attempts: 1
      ack_timeout: 1s
      retry_delay: 1s
      backoff_multiplier: 1
      max_retry_delay: 1s
      retry_jitter: 0s
    - name: integration-fairness
      enabled: true
      msg_id_min: 2998
      msg_id_max: 2998
      max_attempts: 5
      ack_timeout: 1s
      retry_delay: 1h
      backoff_multiplier: 1
      max_retry_delay: 1h
      retry_jitter: 0s
  capacity:
    max_pending_global: 0
    max_pending_per_device: 2
  terminal:
    publisher:
      type: nsq
      nsq:
        nsqd_addrs:
          - 127.0.0.1:14150
        topic: downlink_terminal_events
        dial_timeout: 1s
        read_timeout: 60s
        write_timeout: 1s
        publish_mode: round_robin
        retry_attempts: 1
    retry_interval: 1s
    retry_delay: 1s
    retry_jitter: 0s
    backoff_multiplier: 2
    max_retry_delay: 4s
    retry_lease: 5s
    scan_limit: 100
  retention:
    delivered_ttl: 24h
    failed_ttl: 168h
    discarded_ttl: 168h
    cleanup_interval: 1h
    cleanup_limit: 1000

pipeline:
  allowlist:
    client_ids: []
    msg_ids: []
  blocklist:
    client_ids: []
    msg_ids: []
  rate_limit:
    enabled: false
    max_requests: 100
    window: 1s

upstream:
  routes:
    - name: cluster-a-nsq-upstream
      enabled: true
      msg_id_min: 2000
      msg_id_max: 2999
      target:
        type: nsq
        nsqd_addrs:
          - 127.0.0.1:14150
        topic: message_events
        dial_timeout: 1s
        read_timeout: 60s
        write_timeout: 1s
        publish_mode: round_robin
        retry_attempts: 1
        max_in_flight: 1000
    - name: cluster-b-http-upstream
      enabled: true
      msg_id_min: 1001
      msg_id_max: 1999
      target:
        type: http
        url: http://127.0.0.1:18081/gateway/upstream
        timeout: 5s
        max_in_flight: 1000
