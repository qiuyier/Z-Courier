gateway_node: local
route_msg_ids:
  - 1000

auth:
  static_tokens:
    dev-token:
      client_id: dev-client
      token_id: dev-token
      scopes:
        - gateway:dev

internal_http:
  enabled: true
  addr: 127.0.0.1:18080
  token: dev-internal-token
  max_request_body_size: 10485760

upstream:
  routes:
    - name: dev-http-upstream
      enabled: false
      msg_id_min: 1000
      msg_id_max: 1999
      target:
        type: http
        url: http://127.0.0.1:18081/gateway/upstream
        token: ""
        timeout: 5s
    - name: dev-nsq-upstream
      enabled: false
      msg_id_min: 2000
      msg_id_max: 2999
      target:
        type: nsq
        addr: 127.0.0.1:4150
        topic: message_events
        auth_secret: ""
        dial_timeout: 1s
        read_timeout: 60s
        write_timeout: 1s
