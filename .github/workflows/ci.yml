name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Test Go
        run: go test ./...

      - name: Validate gateway configs
        run: |
          go run ./cmd/gateway -config configs/z-courier.yaml -check-config
          go run ./cmd/gateway -config configs/z-courier.integration.yaml -check-config
          go run ./cmd/gateway -config configs/z-courier.cluster-a.yaml -check-config
          go run ./cmd/gateway -config configs/z-courier.cluster-b.yaml -check-config

      - name: Test PHP SDK
        run: php -d error_reporting=E_ALL sdk/php/tests/run.php

      - name: Lint PHP SDK
        run: find sdk/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install PHP SDK development tools
        run: composer --working-dir=sdk/php install --no-interaction --prefer-dist

      - name: Analyse PHP SDK
        run: composer --working-dir=sdk/php analyse

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate Docker Compose configs
        run: |
          docker compose -f deploy/local/docker-compose.yml config
          docker compose -f deploy/monitoring/docker-compose.yml config
          docker compose --env-file deploy/production/.env.example -f deploy/production/docker-compose.yml config
          docker compose --env-file deploy/production-cluster/.env.example -f deploy/production-cluster/docker-compose.yml config

      - name: Validate Prometheus rules and configs
        run: bash scripts/promtool_check.sh

      - name: Validate Helm chart
        run: |
          HELM_IMAGE=alpine/helm:3.17.3
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/z-courier
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" template z-courier deploy/helm/z-courier >/tmp/z-courier-helm.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/z-courier -f deploy/helm/z-courier/examples/values-production.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" template z-courier deploy/helm/z-courier -f deploy/helm/z-courier/examples/values-production.yaml >/tmp/z-courier-helm-production.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/z-courier -f deploy/helm/z-courier/examples/values-kind-smoke.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" template z-courier deploy/helm/z-courier -f deploy/helm/z-courier/examples/values-kind-smoke.yaml >/tmp/z-courier-helm-kind-smoke.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/z-courier -f deploy/helm/z-courier/examples/values-k8s-e2e.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" template z-courier deploy/helm/z-courier -f deploy/helm/z-courier/examples/values-k8s-e2e.yaml >/tmp/z-courier-helm-k8s-e2e.yaml

      - name: Package Helm chart
        run: |
          mkdir -p reports/helm
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 package deploy/helm/z-courier --destination reports/helm
          ls -l reports/helm

      - name: Upload Helm chart package
        uses: actions/upload-artifact@v6
        with:
          name: helm-chart
          path: reports/helm/*.tgz
          if-no-files-found: error

      - name: Validate Grafana dashboard JSON
        run: jq empty deploy/monitoring/grafana/dashboards/*.json

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Run local, Go SDK, and PHP SDK integration verifiers
        run: bash scripts/e2e.sh

      - name: Run local cluster integration verifier
        run: bash scripts/e2e_cluster.sh

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --no-color

      - name: Dump gateway logs on failure
        if: failure()
        run: |
          for file in log/e2e-*.log; do
            if [ -f "$file" ]; then
              echo "::group::$file"
              tail -n 300 "$file" || true
              echo "::endgroup::"
            fi
          done

      - name: Cleanup local integration stack
        if: always()
        run: docker compose -f deploy/local/docker-compose.yml down -v

  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate
    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build gateway image
        run: docker build --tag z-courier-gateway:ci .

      - name: Smoke gateway image
        run: |
          docker run --rm --entrypoint /bin/sh z-courier-gateway:ci -c \
            'test -x /usr/local/bin/z-courier-gateway && test -f /app/configs/z-courier.yaml && test -f /app/conf/zinx.json'
          docker run --rm z-courier-gateway:ci -h >/tmp/z-courier-gateway-help.txt 2>&1

  production-smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run production reference smoke verifier
        run: bash scripts/production_smoke.sh

      - name: Run production cluster smoke verifier
        run: bash scripts/production_cluster_smoke.sh

  loadtest-smoke:
    name: Load Test Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate
    env:
      LOADTEST_SMOKE_UPSTREAM_MIN_QPS: "1"
      LOADTEST_SMOKE_DOWNLINK_MIN_QPS: "1"
      LOADTEST_SMOKE_MAX_ERROR_RATE: "0"
      LOADTEST_SMOKE_UPSTREAM_MAX_P95_MS: "5000"
      LOADTEST_SMOKE_UPSTREAM_MAX_P99_MS: "10000"
      LOADTEST_SMOKE_DOWNLINK_MAX_P95_MS: "5000"
      LOADTEST_SMOKE_DOWNLINK_MAX_P99_MS: "10000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run load test smoke verifier
        run: bash scripts/loadtest_smoke.sh

      - name: Summarize load test smoke reports
        if: always()
        run: |
          if compgen -G "reports/loadtest-smoke/*.json" >/dev/null; then
            go run ./cmd/loadreport -output reports/loadtest-smoke/summary.md reports/loadtest-smoke/*.json
            cat reports/loadtest-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
            {
              echo ""
              echo "## Baseline Comparison"
            } >> "$GITHUB_STEP_SUMMARY"
            for current in reports/loadtest-smoke/*.json; do
              mode="$(basename "$current" .json)"
              base="reports/baseline/loadtest-smoke/${mode}.json"
              fallback_base="reports/baseline/${mode}.json"
              if [ ! -f "$base" ] && [ -f "$fallback_base" ]; then
                base="$fallback_base"
              fi
              output="reports/loadtest-smoke/compare-${mode}.md"
              if [ -f "$base" ]; then
                if go run ./cmd/loadcompare -base "$base" -current "$current" -output "$output"; then
                  cat "$output" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::Load test baseline comparison failed for ${mode}"
                  echo "- Comparison failed for \`${mode}\`; see job logs." >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                echo "- No baseline found for \`${mode}\` at \`reports/baseline/loadtest-smoke/${mode}.json\` or \`${fallback_base}\`; skipping comparison." >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          else
            echo "No load test smoke reports were generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload load test smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loadtest-smoke-reports
          path: |
            reports/loadtest-smoke/*.json
            reports/loadtest-smoke/summary.md
            reports/loadtest-smoke/compare-*.md
            log/loadtest-smoke-gateway.log
          if-no-files-found: warn

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --no-color

      - name: Dump gateway log on failure
        if: failure()
        run: |
          if [ -f log/loadtest-smoke-gateway.log ]; then
            tail -n 300 log/loadtest-smoke-gateway.log || true
          fi

      - name: Cleanup local integration stack
        if: always()
        run: docker compose -f deploy/local/docker-compose.yml down -v
