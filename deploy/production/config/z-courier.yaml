gateway_node: gateway-prod-1
route_msg_ids:
  - 1000

auth:
  type: http
  http:
    url: http://auth-backend:8080/gateway/auth/verify
    internal_token: "${ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN}"
    timeout: 2s
    max_in_flight: 1000
  cache:
    enabled: true
    max_entries: 10000
    positive_ttl: 30s
    negative_ttl: 3s

internal_http:
  enabled: true
  addr: 0.0.0.0:18080
  auth:
    mode: hmac
    hmac:
      keys:
        prod-internal-2026-01: "${ZCOURIER_INTERNAL_HMAC_SECRET}"
      max_clock_skew: 30s
      nonce_ttl: 2m
      max_nonce_entries: 100000
  max_request_body_size: 10485760
  max_in_flight: 2000

admin_console:
  enabled: false
  path: /console/
  assets_dir: web/admin/dist
  monitoring:
    prometheus_url: ""
    grafana_url: ""
    dashboard_url: ""
  session:
    enabled: false
    ttl: 8h
    cookie_name: zcourier_admin_session
    cookie_secure: true
    cookie_same_site: lax
    role: admin
    store:
      type: redis
      redis:
        addr: redis:6379
        username: ""
        password: "${ZCOURIER_REDIS_PASSWORD}"
        db: 0
        key_prefix: zcourier:production:admin-session
        dial_timeout: 1s
        read_timeout: 1s
        write_timeout: 1s
        operation_timeout: 2s
  audit:
    type: postgres
    capacity: 1000
    postgres:
      dsn: "postgres://zcourier:${ZCOURIER_POSTGRES_PASSWORD}@postgres:5432/zcourier?sslmode=disable"
      auto_migrate: true
      max_open_conns: 10
      max_idle_conns: 5
      conn_max_lifetime: 30m
      operation_timeout: 2s

cluster:
  enabled: false
  internal_addr: http://gateway:18080
  route_refresh_interval: 10s
  registry:
    type: redis
    ttl: 30s
    redis:
      addr: redis:6379
      username: ""
      password: "${ZCOURIER_REDIS_PASSWORD}"
      db: 0
      key_prefix: zcourier:production
      dial_timeout: 1s
      read_timeout: 1s
      write_timeout: 1s
  peer:
    timeout: 2s
    auth:
      mode: hmac
      hmac:
        key_id: prod-peer-2026-01
        keys:
          prod-peer-2026-01: "${ZCOURIER_PEER_HMAC_SECRET}"
        max_clock_skew: 30s
        nonce_ttl: 2m
        max_nonce_entries: 100000

downlink:
  storage:
    type: postgres
    postgres:
      dsn: "postgres://zcourier:${ZCOURIER_POSTGRES_PASSWORD}@postgres:5432/zcourier?sslmode=disable"
      auto_migrate: true
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 30m
  delivery:
    retry_interval: 5s
    retry_delay: 30s
    retry_jitter: 5s
    ack_timeout: 30s
    retry_lease: 30s
    max_attempts: 10
    scan_limit: 500
    bind_flush_limit: 500
    retry_fairness:
      enabled: true
      candidate_multiplier: 4
  policies:
    # Disabled example. Enable only after assigning a reviewed MsgID range.
    - name: production-critical
      enabled: false
      msg_id_min: 3000
      msg_id_max: 3099
      max_attempts: 20
      max_age: 24h
      ack_timeout: 30s
      retry_delay: 5s
      backoff_multiplier: 2
      max_retry_delay: 5m
      retry_jitter: 5s
  capacity:
    # Benchmark before enabling the globally serialized admission limit.
    max_pending_global: 0
    max_pending_per_device: 1000
  terminal:
    # Keep disabled until the NSQ topic or HTTPS webhook receiver is ready.
    publisher:
      type: none
      nsq:
        nsqd_addrs:
          - nsqd:4150
        topic: downlink_terminal_events
        auth_secret: ""
        dial_timeout: 1s
        read_timeout: 60s
        write_timeout: 1s
        publish_mode: round_robin
        retry_attempts: 2
      # To use a signed webhook, change type to http, remove the nsq block,
      # and enable this block:
      # http:
      #   url: https://terminal-events.example.internal/v1/z-courier
      #   timeout: 5s
      #   allow_insecure_http: false
      #   hmac:
      #     key_id: gateway-terminal-v1
      #     secret: replace-from-ZCOURIER_TERMINAL_WEBHOOK_HMAC_SECRET
      #   tls:
      #     ca_file: /run/secrets/terminal-webhook/ca.crt
      #     client_cert_file: /run/secrets/terminal-webhook/tls.crt
      #     client_key_file: /run/secrets/terminal-webhook/tls.key
      #     server_name: terminal-events.example.internal
    retry_interval: 5s
    retry_delay: 30s
    retry_jitter: 5s
    backoff_multiplier: 2
    max_retry_delay: 5m
    retry_lease: 30s
    scan_limit: 100
  retention:
    delivered_ttl: 24h
    failed_ttl: 168h
    discarded_ttl: 168h
    cleanup_interval: 1h
    cleanup_limit: 1000

pipeline:
  allowlist:
    client_ids: []
    msg_ids: []
  blocklist:
    client_ids: []
    msg_ids: []
  rate_limit:
    enabled: true
    max_requests: 1000
    window: 1s

upstream:
  routes:
    - name: production-http-upstream
      enabled: true
      msg_id_min: 1001
      msg_id_max: 1999
      target:
        type: http
        url: http://business-backend:8080/gateway/upstream
        token: "${ZCOURIER_UPSTREAM_INTERNAL_TOKEN}"
        timeout: 5s
        max_in_flight: 2000
    - name: production-nsq-upstream
      enabled: true
      msg_id_min: 2000
      msg_id_max: 2999
      target:
        type: nsq
        nsqd_addrs:
          - nsqd:4150
        topic: message_events
        auth_secret: ""
        dial_timeout: 1s
        read_timeout: 60s
        write_timeout: 1s
        publish_mode: round_robin
        retry_attempts: 2
        max_in_flight: 2000
