gateway_node: discovery-e2e
route_msg_ids:
  - 1000

auth:
  static_tokens:
    discovery-e2e-token:
      client_id: discovery-e2e-client
      token_id: discovery-e2e-token
      scopes:
        - gateway:e2e

internal_http:
  enabled: true
  addr: 127.0.0.1:18191
  token: discovery-e2e-internal-token
  auth:
    mode: token
  max_request_body_size: 1048576
  max_in_flight: 100

cluster:
  enabled: false
  internal_addr: http://127.0.0.1:18191
  route_refresh_interval: 10s
  registry:
    type: memory
    ttl: 30s
  peer:
    token: discovery-e2e-peer-token
    timeout: 1s
    auth:
      mode: token

downlink:
  storage:
    type: memory
  delivery:
    retry_interval: 1s
    retry_delay: 1s
    ack_timeout: 1s
    retry_lease: 5s
    max_attempts: 3
    scan_limit: 100
    bind_flush_limit: 100
  retention:
    delivered_ttl: 1h
    failed_ttl: 1h
    discarded_ttl: 1h
    cleanup_interval: 1h
    cleanup_limit: 100

pipeline:
  allowlist:
    client_ids: []
    msg_ids: []
  blocklist:
    client_ids: []
    msg_ids: []
  rate_limit:
    enabled: false
    max_requests: 100
    window: 1s

upstream:
  routes:
    - name: discovery-e2e-http
      enabled: true
      msg_id_min: 1101
      msg_id_max: 1101
      target:
        type: http
        token: discovery-e2e-upstream-token
        timeout: 1s
        max_in_flight: 100
        discovery:
          type: static
          endpoints:
            - http://127.0.0.1:18192/gateway/upstream
            - http://127.0.0.1:18193/gateway/upstream
        failover:
          enabled: true
          max_attempts: 2
          unhealthy_cooldown: 1s
