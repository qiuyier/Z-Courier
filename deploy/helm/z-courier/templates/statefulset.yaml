apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "z-courier.fullname" . }}
  labels:
    {{- include "z-courier.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "z-courier.headlessServiceName" . }}
  selector:
    matchLabels:
      {{- include "z-courier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "z-courier.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "z-courier.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "z-courier.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: tcp
              containerPort: {{ .Values.zinx.tcpPort }}
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.internalHttp.port }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ZCOURIER_CONFIG
              value: /app/configs/z-courier.yaml
            - name: ZINX_CONFIG_FILE_PATH
              value: /app/conf/zinx.json
            - name: ZCOURIER_AUTH_PROVIDER_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "z-courier.secretName" . }}
                  key: {{ .Values.secret.keys.authProviderSharedToken }}
            - name: ZCOURIER_INTERNAL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "z-courier.secretName" . }}
                  key: {{ .Values.secret.keys.internalHMACSecret }}
            - name: ZCOURIER_PEER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "z-courier.secretName" . }}
                  key: {{ .Values.secret.keys.peerHMACSecret }}
            - name: ZCOURIER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "z-courier.secretName" . }}
                  key: {{ .Values.secret.keys.postgresPassword }}
            - name: ZCOURIER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "z-courier.secretName" . }}
                  key: {{ .Values.secret.keys.redisPassword }}
            - name: ZCOURIER_UPSTREAM_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "z-courier.secretName" . }}
                  key: {{ .Values.secret.keys.upstreamInternalToken }}
            {{- if eq .Values.downlink.terminal.publisher.type "http" }}
            - name: {{ .Values.downlink.terminal.publisher.http.hmac.secretEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "z-courier.secretName" . }}
                  key: {{ .Values.secret.keys.terminalWebhookHMACSecret }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: internal
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: internal
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/configs/z-courier.yaml
              subPath: z-courier.yaml
              readOnly: true
            - name: config
              mountPath: /app/conf/zinx.json
              subPath: zinx.json
              readOnly: true
            {{- if eq .Values.downlink.terminal.publisher.type "http" }}
            {{- with .Values.downlink.terminal.publisher.http.tls }}
            {{- with .secret }}
            - name: terminal-webhook-tls
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "z-courier.fullname" . }}-config
        {{- if eq .Values.downlink.terminal.publisher.type "http" }}
        {{- with .Values.downlink.terminal.publisher.http.tls }}
        {{- with .secret }}
        - name: terminal-webhook-tls
          secret:
            secretName: {{ .name | quote }}
            defaultMode: 0440
            items:
              {{- if .caKey }}
              - key: {{ .caKey | quote }}
                path: {{ .caKey | quote }}
              {{- end }}
              {{- if .clientCertKey }}
              - key: {{ .clientCertKey | quote }}
                path: {{ .clientCertKey | quote }}
              {{- end }}
              {{- if .clientKeyKey }}
              - key: {{ .clientKeyKey | quote }}
                path: {{ .clientKeyKey | quote }}
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
