# Static HTTP discovery example for fixed VM, container, or service addresses.
# This file replaces the default upstream route list when passed with -f.

upstream:
  routes:
    - name: static-http-upstream
      enabled: true
      msgIDMin: 1001
      msgIDMax: 1999
      target:
        type: http
        discovery:
          type: static
          endpoints:
            - http://business-backend-a:8080/gateway/upstream
            - http://business-backend-b:8080/gateway/upstream
        tokenEnv: ZCOURIER_UPSTREAM_INTERNAL_TOKEN
        timeout: 5s
        maxInFlight: 2000
        failover:
          enabled: true
          maxAttempts: 2
          unhealthyCooldown: 15s
