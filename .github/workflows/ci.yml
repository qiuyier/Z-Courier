name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Validate Docker Compose configs
        run: |
          docker compose -f deploy/local/docker-compose.yml config
          docker compose -f deploy/monitoring/docker-compose.yml config

      - name: Validate Grafana dashboard JSON
        run: jq . deploy/monitoring/grafana/dashboards/z-courier-overview.json >/dev/null

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run local integration verifier
        run: bash scripts/e2e.sh

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --no-color

      - name: Cleanup local integration stack
        if: always()
        run: docker compose -f deploy/local/docker-compose.yml down -v
