location = / {
    return 302 /console/;
}

location ^~ /console/ {
    limit_except GET {
        deny all;
    }
    include /etc/nginx/zcourier/proxy-common.conf;
    proxy_pass http://zcourier_console;
}

location = /internal/admin/session/login {
    limit_except POST {
        deny all;
    }
    include /etc/nginx/zcourier/proxy-common.conf;
    proxy_pass http://zcourier_console;
}

location = /internal/admin/session/logout {
    limit_except POST {
        deny all;
    }
    include /etc/nginx/zcourier/proxy-common.conf;
    proxy_pass http://zcourier_console;
}

location ~ ^/(internal/admin/session/me|internal/admin/overview|internal/admin/routes|internal/admin/audit|internal/admin/diagnostics|internal/admin/check|internal/admin/diagnose|internal/debug/route|internal/debug/sessions|internal/debug/cluster/routes|internal/message/status|internal/messages)$ {
    limit_except GET {
        deny all;
    }
    include /etc/nginx/zcourier/proxy-common.conf;
    proxy_pass http://zcourier_console;
}

location ~ ^/(internal/debug/session/disconnect|internal/debug/push|internal/message/requeue|internal/messages/requeue|internal/message/discard|internal/messages/retry/scan)$ {
    limit_except POST {
        deny all;
    }
    include /etc/nginx/zcourier/proxy-common.conf;
    proxy_pass http://zcourier_console;
}

location / {
    return 404;
}
