services:
  postgres:
    image: postgres:16-alpine
    container_name: z-courier-local-postgres
    environment:
      POSTGRES_USER: zcourier
      POSTGRES_PASSWORD: zcourier
      POSTGRES_DB: zcourier
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcourier -d zcourier"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nsqlookupd:
    image: nsqio/nsq:latest
    container_name: z-courier-local-nsqlookupd
    command: /nsqlookupd
    ports:
      - "14160:4160"
      - "14161:4161"
    restart: unless-stopped

  nsqd:
    image: nsqio/nsq:latest
    container_name: z-courier-local-nsqd
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd
    depends_on:
      - nsqlookupd
    ports:
      - "14150:4150"
      - "14151:4151"
    restart: unless-stopped

  nsqadmin:
    image: nsqio/nsq:latest
    container_name: z-courier-local-nsqadmin
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd
    ports:
      - "14171:4171"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: z-courier-local-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: z-courier-local-grafana
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
